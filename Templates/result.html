<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correlation Scores</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        .result-box {
            background-color: #32CD32; /* Light lime green */
            color: black;
            padding: 20px;
            border-radius: 15px; /* Rounded corners */
            width: 200px;
            font-size: 18px;
            font-weight: bold;
        }
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
        }
        .back-button:hover {
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>Results</h1>
    <div class="container">
        <div class="result-box">Bonk : {{ bonkCor }}</div>
        <div class="result-box">Wif : {{ wifCor }}</div>
        <div class="result-box">Fartcoin : {{ fartCor }}</div>
        <div class="result-box">Fwog : {{ fwogCor }}</div>
        <div class="result-box">Giga : {{ gigaCor }}</div>
        <div class="result-box">Goatseus Maximus : {{ goatCor }}</div>
        <div class="result-box">Chill Guy : {{ chillCor }}</div>
        <div class="result-box">Popcat : {{ popcatCor }}</div>
    </div>

    <a href="/" class="back-button">Go Back</a>
</body>
</html>

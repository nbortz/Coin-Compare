<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoinPair</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
    }
    /* Body background: logo image with dark overlay */
    body {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                  url("{{ url_for('static', filename='coinpairlogo.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    /* Menu Container at the top left */
    .menu-container {
      position: absolute;
      top: 20px;
      left: 20px;
    }
    .menu-container a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      margin-right: 20px;
    }
    .menu-container a:hover {
      text-decoration: underline;
    }
    /* Center main area (form container) vertically and horizontally */
    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .form-container {
      background-color: #00FF00;
      width: 1200px; /* stretched container */
      padding: 20px;
      border-radius: 15px;
      box-sizing: border-box;
      color: #000;
    }
    /* Increase inner width for larger input field */
    .form-inner {
      width: 600px;
      margin: 0 auto;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    button {
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- Top left menu container -->
  <div class="menu-container">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="https://coinpair.gitbook.io/coinpair-docs/">Docs</a>
  </div>
  
  <!-- Main form area -->
  <div class="main">
    <div class="form-container">
      <div class="form-inner">
        <form action="/result" method="post">
          <label for="user_value">Enter a Solana contract address:</label>
          <input type="text" id="user_value" name="user_value">
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoinPair</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: 'Open Sans', sans-serif;
    }
    header {
      text-align: center;
      padding: 30px 0;
    }
    header h1 {
      color: #00FF00;
      font-size: 60px;
      margin: 0;
    }
    /* Center main area (form container) vertically and horizontally */
    .main {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 100px); /* Adjust height based on header */
    }
    .form-container {
      background-color: #00FF00;
      width: 1200px; /* stretched container */
      padding: 20px;
      border-radius: 15px;
      box-sizing: border-box;
      color: #000;
    }
    /* Increase inner width by 50% (from 400px to 600px) for a larger input field */
    .form-inner {
      width: 600px;
      margin: 0 auto;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    button {
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 8px; /* rounded edges for the submit button */
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>CoinPair</h1>
  </header>
  <div class="main">
    <div class="form-container">
      <div class="form-inner">
        <form action="/result" method="post">
          <label for="user_value">Enter a Solana contract <address></address>:</label>
          <input type="text" id="user_value" name="user_value">
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

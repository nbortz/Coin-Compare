<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Plotter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #E0E0E0;
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
        }
        .plot {
            margin-top: 20px;
        }
        .btn-primary {
            background-color: #6A1B9A;
            border-color: #6A1B9A;
        }
        .btn-primary:hover {
            background-color: #8E24AA;
            border-color: #8E24AA;
        }
        .btn-link {
            color: #FFB300;
        }
        .btn-link:hover {
            color: #FFCA28;
        }
        .form-control {
            background-color: #1E1E1E;
            color: #E0E0E0;
            border: 1px solid #6A1B9A;
        }
        .form-control:focus {
            background-color: #1E1E1E;
            color: #E0E0E0;
            border-color: #8E24AA;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Crypto Price Plotter</h1>
        <nav class="text-center">
            <a href="/" class="btn btn-link">Home</a>
            <a href="/about" class="btn btn-link">About</a>
        </nav>
        <h5 class="text-center">Input a Contract/Mint Address for a coin you're interested in below</h5>
        <br>
        <br>
        <form action="/" method="post">
            <label for="user_value">Enter a Solana contract <address></address>:</label>
            <input type="text" id="user_value" name="user_value">
            <button type="submit">Submit</button>
        </form>
        <div class="plot text-center">
            <img id="plot-img" src="" alt="Plot will be displayed here" class="img-fluid">
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#plot-form').on('submit', function(event) {
                event.preventDefault();
                $.ajax({
                    url: '/plot',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        $('#plot-img').attr('src', 'data:image/png;base64,' + response.plot_url);
                    }
                });
            });
        });
    </script>
</body>
</html>

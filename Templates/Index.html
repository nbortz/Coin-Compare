<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Plotter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
        }
        .plot {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Crypto Price Plotter</h1>
        <form id="plot-form">
            <div class="form-group">
                <label for="coin_id">Coin ID</label>
                <input type="text" class="form-control" id="coin_id" name="coin_id" required>
            </div>
            <div class="form-group">
                <label for="days">Number of Days</label>
                <input type="number" class="form-control" id="days" name="days" value="365" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Plot</button>
        </form>
        <div class="plot text-center">
            <img id="plot-img" src="" alt="Plot will be displayed here" class="img-fluid">
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#plot-form').on('submit', function(event) {
                event.preventDefault();
                $.ajax({
                    url: '/plot',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        $('#plot-img').attr('src', 'data:image/png;base64,' + response.plot_url);
                    }
                });
            });
        });
    </script>
</body>
</html>
